services:
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    stop_grace_period: 1m
    networks:
      zabbix-net:

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-trunk
    container_name: zabbix-server
    ports:
      - "10051:10051"
    volumes:
      - ./zbx_env/usr/lib/zabbix/alertscripts:/usr/lib/zabbix/alertscripts
      - ./zbx_env/var/lib/zabbix/export:/var/lib/zabbix/export
    env_file:
      - .env
    environment:
      - ZBX_STARTBROWSERPOLLERS=10
      - ZBX_WEBDRIVERURL=http://selenium-chrome:4444
      - ZBX_WEBSERVICEURL=http://zabbix-web-service:10053/report
      - ZBX_TIMEOUT=30
    depends_on:
      - zabbix-db
      - selenium-chrome
    networks:
      zabbix-net:
    stop_grace_period: 30s

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-trunk
    container_name: zabbix-web
    ports:
      - "80:8080"
    env_file:
      - .env
    depends_on:
      - zabbix-db
      - zabbix-server
    networks:
      zabbix-net:

  zabbix-agent:
    image: zabbix/zabbix-agent2:7.0-alpine-latest
    container_name: zabbix-agent
    ports:
      - "10050:10050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
    environment:
      - ZBX_SERVER_ACTIVE=zabbix-server
      - ZBX_HOSTNAME=Zabbix server
    depends_on:
      - zabbix-server
    networks:
      zabbix-net:
    privileged: true

  zabbix-web-service:
    image: zabbix/zabbix-web-service:alpine-trunk
    container_name: zabbix-web-service
    ports:
      - "10053:10053"
    environment:
      - ZBX_ALLOWEDIP=zabbix-server
    networks:
      - zabbix-net

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    shm_size: '2gb'
    environment:
      - SE_NODE_MAX_SESSIONS=10
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - "4444:4444"
    networks:
      - zabbix-net

  zabbix-mcp-server:
    image: zabbix/zabbix-mcp-server:alpine-trunk
    container_name: zabbix-mcp-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - ZBX_FRONTEND_URL=http://zabbix-web:8080/api_jsonrpc.php
      - ZBX_ALLOWEDIP=${ZBX_ALLOWEDIP}
    depends_on:
      - zabbix-web
      - zabbix-server
    networks:
      - zabbix-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge
